spring.application.name=daily-report-api

server.port=8080

# --- H2 Database 設定 ---
# NON_KEYWORDS=KEYWORD を追加して H2 の予約語エラーを回避し、大文字・小文字を識別
spring.datasource.url=jdbc:h2:mem:dailyreportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate 設定 ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# 毎回テーブルを作り直してテストデータを確実に投入
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ★最重要: JPAのテーブル作成完了後に data.sql を実行させる
spring.jpa.defer-datasource-initialization=true

# ★data.sql の自動実行を有効化
spring.sql.init.mode=always