spring.application.name=daily-report-api

# --------------------------------------------------
# MySQL データベース接続設定
# --------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/daily_report_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
spring.datasource.username=devuser
spring.datasource.password=devpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------------------------------------
# JPA / Hibernate 設定
# --------------------------------------------------
# アプリ起動時にJavaのEntityに合わせてDBテーブルを自動生成・更新
spring.jpa.hibernate.ddl-auto=update
# 実行されたSQL文をコンソールに表示
spring.jpa.show-sql=true
# コンソールのSQL文を整形して読みやすくする
spring.jpa.properties.hibernate.format_sql=true